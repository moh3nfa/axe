<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" fill="none">
  <!-- Realistic throwing hatchet, horizontal pose matching venue photo -->
  <defs>
    <linearGradient id="blade" x1="40" y1="40" x2="210" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.25" stop-color="#CBD5E1"/>
      <stop offset="0.55" stop-color="#7B8794"/>
      <stop offset="0.8" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="bladeShine" x1="70" y1="50" x2="160" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handle" x1="200" y1="100" x2="520" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6C49A"/>
      <stop offset="0.35" stop-color="#C08A4E"/>
      <stop offset="0.7" stop-color="#8B5A2B"/>
      <stop offset="1" stop-color="#4A2C14"/>
    </linearGradient>
    <linearGradient id="grip" x1="420" y1="90" x2="540" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F87171"/>
      <stop offset="0.4" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- blade: pointed throwing profile + rear spike -->
    <path d="M48 108c6-34 34-62 74-68 18-3 36 4 48 18 10 12 14 28 10 44-4 18-16 30-32 38-22 12-48 18-74 12-16-4-28-20-26-44z" fill="url(#blade)"/>
    <path d="M68 100c8-22 28-40 54-42 6 12 4 28-6 42-10 14-26 24-42 28 0-10 0-18-6-28z" fill="url(#bladeShine)"/>
    <!-- rear spike / poll -->
    <path d="M168 78c18-4 34 2 44 16 6 8 6 20-2 28-10 10-24 12-38 8l-4-52z" fill="#64748B"/>
    <path d="M200 88l28-6c8 10 8 26-2 36l-24 4c4-10 4-22-2-34z" fill="#94A3B8"/>
    <!-- eye -->
    <rect x="150" y="92" width="34" height="28" rx="4" fill="#0F172A"/>
    <!-- circular brand mark on cheek -->
    <circle cx="120" cy="108" r="14" fill="#334155" fill-opacity=".55"/>
    <circle cx="120" cy="108" r="9" stroke="#E2E8F0" stroke-opacity=".35" stroke-width="1.5" fill="none"/>

    <!-- handle -->
    <path d="M178 102c18-4 40-4 62-2l210 28c-8 14-28 22-48 20L182 128c-4-6-4-18-4-26z" fill="url(#handle)"/>
    <path d="M210 104c40 4 90 10 150 18" stroke="#F3D5A8" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
    <path d="M230 118c50 6 110 14 170 22" stroke="#5C3A1E" stroke-opacity=".25" stroke-width="2"/>

    <!-- red grip -->
    <path d="M420 122c22 2 48 6 72 12 2 8-4 18-14 20-24 2-50-2-72-8-6-2-6-14 0-18 4-4 8-6 14-6z" fill="url(#grip)"/>
    <path d="M440 128h36M448 138h34M456 148h28" stroke="#450A0A" stroke-opacity=".4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
