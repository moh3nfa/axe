<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 640" fill="none">
  <defs>
    <linearGradient id="bladeSteel" x1="24" y1="40" x2="190" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.22" stop-color="#E8EEF4"/>
      <stop offset="0.55" stop-color="#A8B4C2"/>
      <stop offset="0.82" stop-color="#6B7785"/>
      <stop offset="1" stop-color="#3F4A57"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="40" y1="70" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handleWood" x1="120" y1="150" x2="150" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2B989"/>
      <stop offset="0.28" stop-color="#C08A4F"/>
      <stop offset="0.62" stop-color="#8B5A2B"/>
      <stop offset="1" stop-color="#4A2C16"/>
    </linearGradient>
    <linearGradient id="handleShine" x1="128" y1="170" x2="148" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3D5A8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F3D5A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gripRed" x1="118" y1="500" x2="158" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF4444"/>
      <stop offset="0.45" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="pollMetal" x1="110" y1="110" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <radialGradient id="bladeSpec" cx="70" cy="80" r="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#softShadow)">
    <!-- blade -->
    <path d="M34 78c20-38 66-66 112-58 14 2 26 16 24 31-10 56-40 98-84 124-12 7-26 2-33-10C31 135 24 106 34 78z" fill="url(#bladeSteel)"/>
    <path d="M50 88c16-28 48-48 82-42 5 16-2 40-20 66-16 22-38 38-58 46 5-24 6-46-4-70z" fill="url(#bladeEdge)"/>
    <ellipse cx="78" cy="95" rx="34" ry="28" fill="url(#bladeSpec)"/>
    <!-- bevel line -->
    <path d="M58 95c22-8 48-6 70 10" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
    <path d="M52 112c26-4 54 2 76 22" stroke="#0F172A" stroke-opacity=".18" stroke-width="2" stroke-linecap="round"/>

    <!-- eye / poll -->
    <rect x="112" y="108" width="52" height="58" rx="10" fill="url(#pollMetal)"/>
    <rect x="120" y="117" width="36" height="40" rx="6" fill="#0B1220"/>
    <rect x="126" y="124" width="24" height="10" rx="2" fill="#64748B" fill-opacity=".35"/>

    <!-- handle -->
    <path d="M128 164c10-3 24-3 34 0l5 330c-12 10-32 10-44 0l5-330z" fill="url(#handleWood)"/>
    <path d="M136 178h18v290h-18z" fill="url(#handleShine)"/>
    <!-- wood grain -->
    <path d="M140 200c2 40 1 90-1 140M148 210c1 50 2 100 0 150M143 250c1 30 0 70-1 100" stroke="#5C3A1E" stroke-opacity=".22" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ferrule -->
    <rect x="126" y="160" width="38" height="14" rx="3" fill="#475569"/>
    <rect x="126" y="164" width="38" height="2" fill="#94A3B8" fill-opacity=".4"/>

    <!-- red grip -->
    <path d="M126 498c11-4 34-4 46 0l3 98c-13 12-38 12-52 0l3-98z" fill="url(#gripRed)"/>
    <path d="M134 516h30M134 536h30M134 556h30M134 576h30" stroke="#450A0A" stroke-opacity=".4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M132 508h34" stroke="#FCA5A5" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
